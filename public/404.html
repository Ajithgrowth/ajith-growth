<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | Ajith Growth</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0D1B2A;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 520px;
        text-align: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 48px 32px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #38BDF8;
        font-weight: 700;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        margin: 0 0 16px;
        font-weight: 700;
      }
      p {
        color: #94A3B8;
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 32px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 8px;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: #38BDF8;
        color: #0D1B2A;
      }
      .btn-primary:hover {
        background: #7DD3FC;
      }
      .btn-secondary {
        background: transparent;
        color: #FFFFFF;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">HTTP 404 • Resource Not Found</span>
      <h1>Page Not Found</h1>
      <p>The strategic resource or page you requested does not exist or has been relocated.</p>
      <div class="actions">
        <a href="/" class="btn-primary">Return to Home</a>
        <a href="/services" class="btn-secondary">Explore Services</a>
        <a href="/insights" class="btn-secondary">Read Insights</a>
      </div>
    </div>
  </body>
</html>
