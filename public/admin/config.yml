backend:
  name: github
  repo: ajithgrowth/website # Update with your GitHub repo: username/repo
  branch: main
  base_url: https://ajithgrowth.com
  auth_endpoint: api/auth

publish_mode: editorial_workflow

media_folder: "public/images/insights"
public_folder: "/images/insights"

collections:
  - name: "insights"
    label: "Insights Articles"
    label_singular: "Insight Article"
    folder: "content/insights"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Blog Title", name: "title", widget: "string", required: true }
      - { label: "URL Slug", name: "slug", widget: "string", required: true, hint: "Article URL slug: /insights/{slug}" }
      - label: "Category"
        name: "category"
        widget: "select"
        required: true
        options:
          - { label: "Google Ads", value: "google-ads" }
          - { label: "SEO & Local Search", value: "seo-local-search" }
          - { label: "Google Business Profile", value: "google-business-profile" }
          - { label: "Conversion & Landing Pages", value: "conversion-landing-pages" }
          - { label: "Construction Growth", value: "construction-growth" }
          - { label: "GEO & AI Search", value: "geo-ai-search" }
          - { label: "Boutique Growth", value: "boutique-growth" }
          - { label: "Business Strategy", value: "business-strategy" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: true }
      - { label: "Featured Image Alt Text", name: "featuredImageAlt", widget: "string", required: true }
      - { label: "Short Description / Excerpt", name: "excerpt", widget: "text", required: true }
      - label: "Main Blog Content"
        name: "body"
        widget: "markdown"
        required: true
        buttons:
          - heading-two
          - heading-three
          - bold
          - italic
          - link
          - image
          - quote
          - bulleted-list
          - numbered-list
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: true }
      - { label: "Meta Description", name: "metaDescription", widget: "text", required: true }
      - { label: "Author", name: "author", widget: "string", default: "Ajith B R", required: true }
      - { label: "Publish Date", name: "publishedDate", widget: "date", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "Updated Date", name: "updatedDate", widget: "date", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - label: "Quick Summary"
        name: "summary"
        widget: "list"
        summary: "{{fields.summary}}"
        field: { label: "Key Point", name: "point", widget: "string" }
        required: false
      - label: "FAQ Block"
        name: "faqs"
        widget: "list"
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string", required: true }
          - { label: "Answer", name: "answer", widget: "text", required: true }
        required: false
      - label: "Keywords"
        name: "keywords"
        widget: "list"
        field: { label: "Keyword", name: "keyword", widget: "string" }
        required: false
      - { label: "Featured Toggle", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
